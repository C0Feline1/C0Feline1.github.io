<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>独立开发人C0 · 星梦画廊 Stardream Gallery</title>
<meta name="description" content="Developer site for Stardream Gallery (app-ads.txt, privacy policy link).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --shell: #5b4bb7;
    --shell-dark: #3f3283;
    --shell-light: #7d6ee0;
    --bezel: #2a2a3a;
    --lcd-bg: #1b1f3b;
    --lcd-text: #f4efd0;
    --lcd-accent: #ffd45e;
    --lcd-dim: #8d92c8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(circle at 20% 20%, #2b2466 0, transparent 45%),
      radial-gradient(circle at 80% 80%, #1c3b66 0, transparent 45%),
      #12112b;
    font-family: "DotGothic16", "Press Start 2P", monospace;
    color: var(--lcd-text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
  }
  .console {
    width: min(760px, 100%);
    background: linear-gradient(180deg, var(--shell-light), var(--shell) 40%, var(--shell-dark));
    border-radius: 28px 28px 90px 90px;
    padding: 22px 28px 34px;
    box-shadow: 0 0 0 4px #251d5a, 0 24px 60px rgba(0, 0, 0, .55), inset 0 3px 0 rgba(255, 255, 255, .25);
  }
  .brandline {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "Press Start 2P", monospace; font-size: 10px;
    color: #d9d2ff; letter-spacing: 2px; margin-bottom: 14px;
  }
  .led { width: 10px; height: 10px; border-radius: 50%; background: #5dff8f; box-shadow: 0 0 8px #5dff8f; display: inline-block; margin-right: 8px; animation: pulse 2s infinite; }
  .bezel {
    background: var(--bezel);
    border-radius: 14px 14px 14px 14px;
    padding: 16px 16px 22px;
    box-shadow: inset 0 0 0 3px #1a1a26;
  }
  .screen {
    position: relative;
    aspect-ratio: 3 / 2;
    min-height: 330px;
    background: var(--lcd-bg);
    image-rendering: pixelated;
    overflow: hidden;
    padding: 22px 26px;
    border: 3px solid #0c0d1c;
  }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 3px);
  }
  .stars, .stars::before, .stars::after {
    position: absolute; inset: 0; content: ""; pointer-events: none;
    background-image:
      radial-gradient(2px 2px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 74% 12%, #ffd45e 50%, transparent 51%),
      radial-gradient(2px 2px at 88% 46%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 30% 82%, #9fe8ff 50%, transparent 51%),
      radial-gradient(2px 2px at 58% 64%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 8% 60%, #ffd45e 50%, transparent 51%);
    animation: twinkle 2.4s steps(2) infinite;
  }
  .stars::before { transform: translate(18px, 26px); animation-delay: .8s; }
  .stars::after { transform: translate(-22px, 40px); animation-delay: 1.4s; }

  .title { position: relative; text-align: center; margin: 0 0 4px; }
  .title .en { font-family: "Press Start 2P", monospace; font-size: clamp(14px, 3.2vw, 22px); color: var(--lcd-accent); text-shadow: 3px 3px 0 #7a3b00; line-height: 1.5; }
  .title .zh { font-size: clamp(22px, 5vw, 34px); margin-top: 8px; text-shadow: 3px 3px 0 #0a0a18; }
  .sub { position: relative; text-align: center; color: var(--lcd-dim); font-size: 14px; margin: 6px 0 18px; }

  .menu { position: relative; list-style: none; margin: 0 auto; padding: 0; width: min(420px, 100%); }
  .menu li { margin: 6px 0; }
  .menu a {
    display: block; color: var(--lcd-text); text-decoration: none;
    padding: 8px 12px 8px 34px; position: relative; font-size: 18px;
    border: 2px solid transparent;
  }
  .menu a small { color: var(--lcd-dim); font-size: 12px; margin-left: 8px; }
  .menu a::before { content: ""; position: absolute; left: 12px; top: 50%; width: 10px; height: 10px; margin-top: -5px; background: transparent; }
  .menu a.active, .menu a:hover, .menu a:focus-visible {
    outline: none; background: #2d3470; border-color: var(--lcd-accent); color: #fff;
  }
  .menu a.active::before, .menu a:hover::before, .menu a:focus-visible::before {
    background: var(--lcd-accent); clip-path: polygon(0 0, 100% 50%, 0 100%); animation: blink 0.8s steps(2) infinite;
  }
  .status { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--lcd-dim); z-index: 1; }
  .status .cursor { display: inline-block; width: 8px; height: 12px; background: var(--lcd-accent); vertical-align: -1px; animation: blink 1s steps(2) infinite; }

  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; padding: 0 10px; }
  .dpad { position: relative; width: 96px; height: 96px; }
  .dpad button { position: absolute; width: 32px; height: 32px; background: #1f1f2d; border: 0; cursor: pointer; box-shadow: inset 0 -3px 0 #0e0e18; color: #6a6a88; font-size: 12px; }
  .dpad .up { left: 32px; top: 0; border-radius: 6px 6px 0 0; }
  .dpad .down { left: 32px; top: 64px; border-radius: 0 0 6px 6px; }
  .dpad .left { left: 0; top: 32px; border-radius: 6px 0 0 6px; }
  .dpad .right { left: 64px; top: 32px; border-radius: 0 6px 6px 0; }
  .dpad .mid { position: absolute; left: 32px; top: 32px; width: 32px; height: 32px; background: #1f1f2d; }
  .dpad button:active { background: #3b3b52; }
  .ab { display: flex; gap: 14px; transform: rotate(-18deg); }
  .ab button { width: 52px; height: 52px; border-radius: 50%; border: 0; background: #b5365b; color: #ffd9e3; font-family: "Press Start 2P", monospace; font-size: 14px; box-shadow: inset 0 -5px 0 #7c1f3b, 0 3px 0 #2a1450; cursor: pointer; }
  .ab button:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 #7c1f3b; }
  .ab button + button { margin-top: -14px; }
  .startsel { display: flex; justify-content: center; gap: 22px; margin-top: -6px; transform: rotate(-18deg); }
  .startsel span { width: 44px; height: 10px; border-radius: 6px; background: #2a2060; box-shadow: inset 0 -2px 0 #1a1340; }

  .foot { text-align: center; margin-top: 18px; font-size: 11px; color: #cfc8ff; font-family: "Press Start 2P", monospace; line-height: 1.8; }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes twinkle { 50% { opacity: .25; } }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (max-width: 560px) {
    .console { padding: 16px 12px 26px; border-radius: 20px 20px 56px 56px; }
    .screen { padding: 16px 12px; min-height: 380px; aspect-ratio: auto; }
    .menu a { font-size: 16px; }
    .menu a small { display: block; margin: 2px 0 0; }
    .controls { padding: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main class="console">
  <div class="brandline"><span><i class="led"></i>POWER</span><span>C0 ADVANCE</span></div>
  <div class="bezel">
    <div class="screen">
      <div class="stars"></div>
      <h1 class="title">
        <div class="en">STARDREAM<br>GALLERY</div>
        <div class="zh">星梦画廊</div>
      </h1>
      <p class="sub">独立开发人C0 的开发者主页</p>
      <ul class="menu" id="menu">
        <li><a href="https://cyf211514104.github.io/stardream-gallery-privacy/" class="active">隐私政策<small>Privacy Policy</small></a></li>
        <li><a href="/app-ads.txt">app-ads.txt<small>AdMob</small></a></li>
      </ul>
      <div class="status">▲▼ 选择　A 确认　<span class="cursor"></span></div>
    </div>
  </div>
  <div class="controls">
    <div class="dpad">
      <button class="up" aria-label="上" data-dir="-1">▲</button>
      <button class="left" aria-label="左" tabindex="-1">◀</button>
      <div class="mid"></div>
      <button class="right" aria-label="右" tabindex="-1">▶</button>
      <button class="down" aria-label="下" data-dir="1">▼</button>
    </div>
    <div class="startsel"><span></span><span></span></div>
    <div class="ab"><button id="btnB" aria-label="B">B</button><button id="btnA" aria-label="A">A</button></div>
  </div>
  <div class="foot">© 2026 独立开发人C0<br>Android · com.stardreamgallery.game</div>
</main>
<script>
  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('#menu a'));
    var index = 0;
    function select(i) {
      index = (i + links.length) % links.length;
      links.forEach(function (a, n) { a.classList.toggle('active', n === index); });
    }
    links.forEach(function (a, n) { a.addEventListener('mouseenter', function () { select(n); }); });
    document.querySelectorAll('[data-dir]').forEach(function (b) {
      b.addEventListener('click', function () { select(index + Number(b.dataset.dir)); });
    });
    document.getElementById('btnA').addEventListener('click', function () { links[index].click(); });
    document.getElementById('btnB').addEventListener('click', function () { select(0); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { select(index + 1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { select(index - 1); e.preventDefault(); }
      else if (e.key === 'Enter' || e.key.toLowerCase() === 'z') { links[index].click(); }
    });
  })();
</script>
</body>
</html>
